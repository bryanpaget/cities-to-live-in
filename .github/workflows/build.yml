name: Build Presentation PDFs

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium --no-install-recommends

      - name: Build English PDF
        run: |
          mkdir -p temp
          cat config/header-en.md content/slides-en.md > temp/slides-en-combined.md
          marp --allow-local-files --pdf-outlines --pdf --output cities-people-en.pdf temp/slides-en-combined.md

      - name: Upload English PDF
        uses: actions/upload-artifact@v4
        with:
          name: cities-people-en
          path: cities-people-en.pdf

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cities-people-en.pdf
